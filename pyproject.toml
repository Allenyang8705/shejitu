[project]
name = "autodaily-generator"
version = "0.1.0"
description = "内部工具：从 GitHub 与飞书采集当日工作数据，生成三段式日报并推送（设计见 specs/design.md）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.1",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
]
